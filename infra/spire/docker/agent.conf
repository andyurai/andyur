# Containerized SPIRE agent for Andyur (Slice 3). The key difference from the host
# agent (../agent.conf) is the WorkloadAttestor: this one uses "docker", so it
# identifies a workload by the LABELS on its container, not by executable path +
# uid. That is what binds a run's SVID to its container -- a boundary the agent
# (arbitrary code inside the container, uid 1001, no docker.sock) cannot forge.
#
# For the docker attestor to map a caller back to its container it must see the
# caller's PID and the Docker daemon, so this agent runs with --pid=host and a
# mounted /var/run/docker.sock (see docker-compose.spire.yml).
agent {
    data_dir = "/opt/spire/data"
    log_level = "DEBUG"
    server_address = "andyur-spire-server"
    server_port = "8081"
    # published on a shared volume that run-containers mount read-only
    socket_path = "/run/spire/sockets/api.sock"
    trust_domain = "andyur.local"
    # local dev: trust the server on first connect instead of pre-sharing the bundle
    insecure_bootstrap = true
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }
    KeyManager "memory" {
        plugin_data {}
    }
    WorkloadAttestor "docker" {
        plugin_data {
            # SPIRE >= 1.11 ships a "new container locator" that resolves a
            # caller's container automatically (including cgroup v2 on Docker
            # Desktop), so no custom cgroup matchers are set. If it ever fails to
            # locate containers in a given environment, set
            # use_new_container_locator = false and supply container_id_cgroup_matchers.
        }
    }
}
