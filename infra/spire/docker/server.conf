# Containerized SPIRE server for Andyur (Slice 3: per-run identity by container
# attestation). Distinct from ../server.conf (the host dev server): this one runs
# inside a container, binds all interfaces on the compose network, and keeps its
# datastore/keys on a mounted volume.
server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "andyur.local"
    data_dir = "/opt/spire/data"
    log_level = "INFO"
    ca_ttl = "24h"
    default_x509_svid_ttl = "1h"
    default_jwt_svid_ttl = "5m"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/datastore.sqlite3"
        }
    }
    # Agents join with a short-lived token minted by the server (see verify script).
    NodeAttestor "join_token" {
        plugin_data {}
    }
    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/keys.json"
        }
    }
}
