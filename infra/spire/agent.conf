agent {
    data_dir = "./data/spire/agent"
    log_level = "DEBUG"
    server_address = "127.0.0.1"
    server_port = "8081"
    socket_path = "./data/spire/agent/api.sock"
    trust_domain = "andyur.local"
    # local dev: trust the server on first connect instead of pre-sharing
    # the trust bundle
    insecure_bootstrap = true
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }
    KeyManager "disk" {
        plugin_data {
            directory = "./data/spire/agent"
        }
    }
    WorkloadAttestor "unix" {
        plugin_data {
            # lets registration entries select on the executable path, which
            # is how andyur's per-role interpreter binaries are told apart
            discover_workload_path = true
        }
    }
}
