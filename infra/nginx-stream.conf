# L4 (TCP passthrough) load balancer for the mTLS control-plane replicas.
#
# Unlike the L7 http proxy (infra/nginx.conf), this does NOT terminate TLS: it
# passes the raw TCP stream through to a backend replica, so the runner's client
# X509-SVID survives to the server and the SPIFFE mutual-TLS handshake happens end
# to end between runner and replica. Any replica can serve any connection (all
# state is in Postgres; every replica trusts the same SPIRE-issued bundle).
events {}
stream {
    upstream andyur_servers {
        server server1:8642;
        server server2:8642;
    }
    server {
        listen 8642;
        proxy_pass andyur_servers;
    }
}
