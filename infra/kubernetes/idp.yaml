---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: andyur-idp
  namespace: andyur-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: andyur-keycloak-db
  namespace: andyur-system
spec:
  clusterIP: None
  selector: {app: andyur-keycloak-db}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: andyur-keycloak-db
  namespace: andyur-system
spec:
  serviceName: andyur-keycloak-db
  replicas: 1
  selector: {matchLabels: {app: andyur-keycloak-db}}
  template:
    metadata:
      labels: {app: andyur-keycloak-db}
    spec:
      serviceAccountName: andyur-idp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          # PINNED BY DIGEST, like every other image in this tree. I wrote this
          # file with tags -- `postgres:16.4-alpine`, `keycloak:26.2` -- while
          # the manifests beside it pin Envoy, socat, the collector and Jaeger
          # by digest. A tag is a name someone else can repoint, so a deployment
          # that pins one is a deployment whose identity is not its own.
          # Resolved from the tags above: keycloak 26.2, postgres 16.4-alpine.
          image: docker.io/library/postgres@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
          env:
            - {name: POSTGRES_DB, value: keycloak}
            - {name: POSTGRES_USER, value: keycloak}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: andyur-idp-secrets, key: db-password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: andyur-keycloak
  namespace: andyur-system
spec:
  selector: {app: andyur-keycloak}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: andyur-keycloak
  namespace: andyur-system
spec:
  replicas: 1
  selector: {matchLabels: {app: andyur-keycloak}}
  strategy: {type: Recreate}
  template:
    metadata:
      labels: {app: andyur-keycloak}
    spec:
      serviceAccountName: andyur-idp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak@sha256:4883630ef9db14031cde3e60700c9a9a8eaf1b5c24db1589d6a2d43de38ba2a9
          # REFUSE TO BOOT WITHOUT THE SECRETS rather than come up with an
          # unauthenticated admin -- the same guard infra/docker-compose.yml
          # uses, for the same reason.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              : "${KC_BOOTSTRAP_ADMIN_PASSWORD:?create the andyur-idp-secrets Secret first}"
              : "${KC_DB_PASSWORD:?create the andyur-idp-secrets Secret first}"
              # NOT --optimized: that flag asserts a `kc.sh build` was already
              # baked into the image, and the upstream image refuses it on a
              # first start ("The '--optimized' flag was used for first ever
              # server start"). Building at startup costs ~20s once per pod and
              # is what the unmodified upstream image supports; an adopter who
              # wants the faster path bakes their own image with kc.sh build.
              exec /opt/keycloak/bin/kc.sh start --import-realm
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL_HOST, value: andyur-keycloak-db.andyur-system.svc}
            - {name: KC_DB_URL_DATABASE, value: keycloak}
            - {name: KC_DB_USERNAME, value: keycloak}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: andyur-idp-secrets, key: db-password}}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: andyur-idp-secrets, key: admin-password}}
            # HTTP is confined to this namespace by the NetworkPolicy below:
            # nothing outside the control plane can reach it, and TLS in front
            # of Keycloak is a reverse-proxy concern in a real deployment.
            - {name: KC_HTTP_ENABLED, value: "true"}
            # ONE canonical issuer, and it is the name every in-cluster caller
            # resolves. Tokens carry this as `iss` and the server validates that
            # exact string.
            - {name: KC_HOSTNAME, value: "http://andyur-keycloak.andyur-system.svc:8080"}
            - {name: KC_HOSTNAME_STRICT, value: "false"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_CACHE, value: local}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: 1000m, memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: realm, configMap: {name: andyur-idp-realm}}
        - {name: tmp, emptyDir: {}}
---
# THE IdP IS NEVER ON THE RUN PATH. An agent run has no route to it: ingress is
# the control plane only, and the runs namespace is not in the list. That is the
# same containment the compose file states in words and gets from separate
# Docker networks; here it is enforced by the API server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: idp
  namespace: andyur-system
spec:
  podSelector: {matchLabels: {app: andyur-keycloak}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: andyur-server}}
        - podSelector: {matchLabels: {app: andyur-operator}}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector: {matchLabels: {app: andyur-keycloak-db}}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: idp-db
  namespace: andyur-system
spec:
  podSelector: {matchLabels: {app: andyur-keycloak-db}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: andyur-keycloak}}
      ports: [{protocol: TCP, port: 5432}]
  egress: []
