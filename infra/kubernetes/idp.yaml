# THE IDENTITY PROVIDER THE PROD PROFILE REQUIRES.
#
# `ANDYUR_PROFILE=prod` refuses to start without `ANDYUR_USER_AUTH=on`
# ("production runs must inherit an enterprise-authenticated subject"), and
# user-auth in turn refuses to start without an issuer AND an audience to
# validate against -- because admin and ownership are read from the user's
# token, so a token minted for another audience would otherwise be trusted for
# authority (config.assert_user_auth).
#
# Until this file existed the Kubernetes reference deployment shipped `prod`
# and deployed no IdP, so the control plane exited 3 at boot and every cluster
# that ever ran did so on a hand-edit in nobody's manifest. That was found by
# deploying the partner bundle into a real cluster from a directory with no
# checkout, which is what the "a partner can deploy this" gate line means.
#
# WHAT THIS IS AND IS NOT. It is the same reference IdP the Docker stack
# composes -- Keycloak with the bundled DEMO realm -- expressed for Kubernetes.
# The realm's credentials are PUBLIC BY DEFINITION: alice/bob/carol and their
# passwords are committed in infra/keycloak/realm-andyur.json, so anything that
# can reach this Keycloak can authenticate as them. It is a reference to log in
# against, not a tenant directory. An adopter points ANDYUR_OIDC_* at their own
# IdP and deletes this file; nothing else references it.
#
# THE ISSUER IS THE IN-CLUSTER SERVICE URL. Tokens carry `iss` = KC_HOSTNAME,
# and the server validates that exact string, so both sides must agree on one
# spelling. In-cluster is the spelling every component here can reach. An
# adopter fronting Keycloak with an ingress sets KC_HOSTNAME to that external
# URL instead, and sets ANDYUR_OIDC_ISSUER on the server to match -- the two
# move together or logins validate against an issuer nobody issued.
#
# NO CREDENTIAL IS SHIPPED. Create the Secret first, exactly as
# `andyur-secrets` is created for the control plane:
#
#   kubectl -n andyur-system create secret generic andyur-idp-secrets \
#     --from-literal=admin-password="$(openssl rand -hex 24)" \
#     --from-literal=db-password="$(openssl rand -hex 24)"
#
# Keycloak and Postgres both REFUSE TO BOOT without them rather than coming up
# with an unauthenticated admin, which is the same guard the compose file uses.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: andyur-idp-realm
  namespace: andyur-system
data:
  # A COPY of infra/keycloak/realm-andyur.json, embedded because a bundle a
  # partner receives cannot reference a file from a checkout they do not have.
  # tests/test_kubernetes_packaging.py pins the two against each other, so the
  # copy cannot drift from the realm the Docker stack imports.
  realm-andyur.json: |
    {
      "realm": "andyur",
      "enabled": true,
      "sslRequired": "none",
      "accessTokenLifespan": 300,
      "revokeRefreshToken": true,
      "refreshTokenMaxReuse": 0,
      "roles": {
        "realm": [
          {
            "name": "andyur-admin",
            "description": "may see and manage every owner's agents and the Andyur ops surfaces (never impersonate: triggering stays owner-only)"
          }
        ]
      },
      "clientScopes": [
        {
          "name": "files:read",
          "description": "read access to files",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          }
        },
        {
          "name": "files:write",
          "description": "write access to files (alice is NOT entitled to this)",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          }
        }
      ],
      "clients": [
        {
          "clientId": "andyur-console",
          "description": "the console's own public client: Auth Code + PKCE only, no resource-owner password grant, audience=andyur only",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "attributes": {
            "pkce.code.challenge.method": "S256"
          },
          "redirectUris": [
            "http://127.0.0.1:8765/callback",
            "http://127.0.0.1:8766/callback",
            "http://127.0.0.1:8767/callback",
            "http://127.0.0.1:8768/callback",
            "http://127.0.0.1:8769/callback"
          ],
          "protocolMappers": [
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "config": {
                "claim.name": "realm_access.roles",
                "jsonType.label": "String",
                "multivalued": "true",
                "access.token.claim": "true",
                "id.token.claim": "false",
                "userinfo.token.claim": "false"
              }
            },
            {
              "name": "andyur-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.custom.audience": "andyur",
                "access.token.claim": "true",
                "id.token.claim": "false"
              }
            },
            {
              "name": "sub-from-user-id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "config": {
                "user.attribute": "id",
                "claim.name": "sub",
                "jsonType.label": "String",
                "access.token.claim": "true",
                "id.token.claim": "true"
              }
            },
            {
              "name": "username",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "config": {
                "access.token.claim": "true",
                "id.token.claim": "true",
                "userinfo.token.claim": "true",
                "user.attribute": "username",
                "claim.name": "preferred_username",
                "jsonType.label": "String"
              }
            },
            {
              "name": "email",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "config": {
                "access.token.claim": "true",
                "id.token.claim": "true",
                "userinfo.token.claim": "true",
                "user.attribute": "email",
                "claim.name": "email",
                "jsonType.label": "String"
              }
            },
            {
              "name": "full name",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-full-name-mapper",
              "config": {
                "access.token.claim": "true",
                "id.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "andyur-cli",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "attributes": {
            "pkce.code.challenge.method": "S256"
          },
          "redirectUris": [
            "http://127.0.0.1:8765/callback",
            "http://127.0.0.1:8766/callback",
            "http://127.0.0.1:8767/callback",
            "http://127.0.0.1:8768/callback",
            "http://127.0.0.1:8769/callback"
          ],
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": false,
          "optionalClientScopes": [
            "files:read"
          ],
          "protocolMappers": [
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "config": {
                "claim.name": "realm_access.roles",
                "jsonType.label": "String",
                "multivalued": "true",
                "access.token.claim": "true",
                "id.token.claim": "false",
                "userinfo.token.claim": "false"
              }
            },
            {
              "name": "andyur-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.custom.audience": "andyur",
                "access.token.claim": "true",
                "id.token.claim": "false"
              }
            },
            {
              "name": "agent-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "andyur-agent",
                "access.token.claim": "true",
                "id.token.claim": "false"
              }
            },
            {
              "name": "sub-from-user-id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "config": {
                "user.attribute": "id",
                "claim.name": "sub",
                "jsonType.label": "String",
                "access.token.claim": "true",
                "id.token.claim": "true"
              }
            },
            {
              "name": "username",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "config": {
                "access.token.claim": "true",
                "id.token.claim": "true",
                "userinfo.token.claim": "true",
                "user.attribute": "username",
                "claim.name": "preferred_username",
                "jsonType.label": "String"
              }
            },
            {
              "name": "email",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "config": {
                "access.token.claim": "true",
                "id.token.claim": "true",
                "userinfo.token.claim": "true",
                "user.attribute": "email",
                "claim.name": "email",
                "jsonType.label": "String"
              }
            },
            {
              "name": "full name",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-full-name-mapper",
              "config": {
                "access.token.claim": "true",
                "id.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "andyur-agent",
          "description": "the delegatee: exchanges alice's token for a downstream, narrowed token",
          "enabled": true,
          "publicClient": false,
          "secret": "agent-secret",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true,
          "optionalClientScopes": [
            "files:read"
          ],
          "attributes": {
            "standard.token.exchange.enabled": "true"
          },
          "protocolMappers": [
            {
              "name": "sub-from-user-id",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "config": {
                "user.attribute": "id",
                "claim.name": "sub",
                "jsonType.label": "String",
                "access.token.claim": "true",
                "id.token.claim": "true"
              }
            },
            {
              "name": "tool-files-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "tool-files",
                "access.token.claim": "true",
                "id.token.claim": "false"
              }
            }
          ]
        },
        {
          "clientId": "tool-files",
          "description": "the downstream target (audience) the delegated token is bound to",
          "enabled": true,
          "publicClient": false,
          "bearerOnly": true
        },
        {
          "clientId": "grafana",
          "name": "Grafana",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "grafana-oidc-secret",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": [
            "http://127.0.0.1:3000/login/generic_oauth"
          ],
          "webOrigins": [
            "http://127.0.0.1:3000"
          ],
          "protocolMappers": [
            {
              "name": "username",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "config": {
                "access.token.claim": "true",
                "id.token.claim": "true",
                "userinfo.token.claim": "true",
                "user.attribute": "username",
                "claim.name": "preferred_username",
                "jsonType.label": "String"
              }
            },
            {
              "name": "email",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "config": {
                "access.token.claim": "true",
                "id.token.claim": "true",
                "userinfo.token.claim": "true",
                "user.attribute": "email",
                "claim.name": "email",
                "jsonType.label": "String"
              }
            },
            {
              "name": "full name",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-full-name-mapper",
              "config": {
                "access.token.claim": "true",
                "id.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "config": {
                "access.token.claim": "true",
                "id.token.claim": "true",
                "userinfo.token.claim": "true",
                "claim.name": "realm_access.roles",
                "jsonType.label": "String",
                "multivalued": "true"
              }
            }
          ]
        }
      ],
      "users": [
        {
          "id": "11111111-1111-1111-1111-111111111111",
          "username": "alice",
          "enabled": true,
          "email": "alice@andyur.test",
          "emailVerified": true,
          "firstName": "Alice",
          "lastName": "Example",
          "credentials": [
            {
              "type": "password",
              "value": "alice-password",
              "temporary": false
            }
          ]
        },
        {
          "id": "22222222-2222-2222-2222-222222222222",
          "username": "bob",
          "enabled": true,
