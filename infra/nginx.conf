# Load balancer in front of the Andyur server replicas. Round-robins requests
# across replicas; any replica can serve any request because all state lives in
# Postgres, not in the process.
events {}
http {
    upstream andyur_servers {
        server server1:8642;
        server server2:8642;
    }
    server {
        listen 8642;
        location / {
            proxy_pass http://andyur_servers;
            proxy_set_header Host $host;
        }
    }
}
