[pytest]
# A per-test timeout, so a test that HANGS presents as a red test rather than a
# stalled CI job. Found by a mutation sweep: removing the socket timeout inside
# the readiness probe made the suite hang forever instead of failing, which in CI
# is a job you eventually cancel and a signal you never get.
#
# `thread` rather than `signal`: several tests run real servers on background
# threads and drive subprocesses, and the signal method only interrupts the main
# thread, so it would miss exactly the hangs this exists for.
timeout = 120
timeout_method = thread

markers =
    redteam: an attack a red team actually ran; see tests/redteam/README.md
    integration: needs local infrastructure (SPIRE workload API, role binaries, Docker); these modules also skip themselves when it is absent, so the marker exists to let CI split lanes explicitly rather than rely on skips: `-m "not integration"` is the fast lane
